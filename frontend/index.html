<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Lapis - Resp:. Logia:. Sob:. Dignidad Humana N° 149</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SweetAlert2 CSS y JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Alpine.js Core -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans" x-data="appLapis">

  <!-- Navegación Superior / Header con Botones Siempre Visibles -->
  <header class="bg-slate-900 text-white shadow-lg border-b border-amber-500/30 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Logo Principal de la Logia -->
        <div class="flex items-center gap-3 cursor-pointer" @click="vistaActual = 'pasos_perdidos'">
          <img src="logo.png" alt="Logo Logia Dignidad Humana N° 149" class="h-10 w-auto object-contain rounded">
          <div>
            <span class="font-extrabold text-amber-400 text-lg tracking-wide block leading-none">PROYECTO LAPIS</span>
            <span class="text-[10px] text-slate-400 uppercase tracking-widest block">R.:L.:S.: Dignidad Humana N° 149</span>
          </div>
        </div>

        <!-- Botones de Navegación -->
        <nav class="hidden md:flex items-center space-x-2">
          <button @click="vistaActual = 'pasos_perdidos'" 
                  :class="vistaActual === 'pasos_perdidos' ? 'bg-amber-500/20 text-amber-400 border-amber-500' : 'text-slate-300 hover:bg-slate-800 hover:text-white border-transparent'"
                  class="px-3 py-2 rounded-md text-sm font-medium transition-colors border-b-2">
            Pasos Perdidos
          </button>

          <button @click="vistaActual = 'tocar_puerta'" 
                  :class="vistaActual === 'tocar_puerta' ? 'bg-amber-500/20 text-amber-400 border-amber-500' : 'text-slate-300 hover:bg-slate-800 hover:text-white border-transparent'"
                  class="px-3 py-2 rounded-md text-sm font-medium transition-colors border-b-2">
            Tocar Puerta
          </button>

          <button @click="vistaActual = 'palabra_pase'" 
                  :class="vistaActual === 'palabra_pase' ? 'bg-amber-500/20 text-amber-400 border-amber-500' : 'text-slate-300 hover:bg-slate-800 hover:text-white border-transparent'"
                  class="px-3 py-2 rounded-md text-sm font-medium transition-colors border-b-2">
            Palabra de Pase
          </button>

          <button @click="vistaActual = 'umbral'" 
                  :class="vistaActual === 'umbral' ? 'bg-amber-500/20 text-amber-400 border-amber-500' : 'text-slate-300 hover:bg-slate-800 hover:text-white border-transparent'"
                  class="px-3 py-2 rounded-md text-sm font-medium transition-colors border-b-2">
            Umbral
          </button>

          <!-- Opción adicional exclusiva del Perfil del Trono / Venerable Maestro / Webmaster -->
          <template x-if="tienePermisoPerfilTrono()">
            <button @click="vistaActual = 'admin'" 
                    :class="vistaActual === 'admin' ? 'bg-amber-500/20 text-amber-400 border-amber-500' : 'text-slate-300 hover:bg-slate-800 hover:text-white border-transparent'"
                    class="px-3 py-2 rounded-md text-sm font-medium transition-colors border-b-2 flex items-center gap-1.5">
              <span>👑</span>
              <span>Perfil del Trono</span>
            </button>
          </template>
        </nav>

        <!-- Bloque de Usuario / Cierre de Sesión -->
        <div class="flex items-center gap-3">
          <template x-if="usuarioLogueado">
            <div class="flex items-center gap-3">
              <div class="text-right hidden sm:block">
                <span class="text-xs text-amber-400 font-bold block leading-none" x-text="usuarioLogueado.nombre"></span>
                <span class="text-[10px] text-slate-400 uppercase tracking-wider block" x-text="usuarioLogueado.rol.replace('_', ' ')"></span>
              </div>
              <button @click="cerrarSesion()" class="text-xs bg-red-900/50 hover:bg-red-800 text-red-200 px-3 py-1.5 rounded border border-red-500/30 transition-colors">
                Salir
              </button>
            </div>
          </template>
        </div>

      </div>
    </div>
  </header>

  <!-- Contenido Principal Dinámico -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div x-html="VistasProyectoLapis[vistaActual]"></div>
  </main>

  <!-- Pie de Página Institucional -->
  <footer class="bg-slate-900 text-slate-400 border-t border-slate-800 py-6 text-center text-xs mt-auto">
    <div class="max-w-7xl mx-auto px-4">
      <p>© 2026 Resp:. Logia:. Sob:. Dignidad Humana N° 149. Todos los derechos reservados.</p>
      <p class="mt-1 text-slate-500">A:. G:. D:. G:. A:. D:. U:.</p>
    </div>
  </footer>

  <!-- Carga de Archivos JavaScript -->
  <script src="js/api.js"></script>
  <script src="js/componentes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
