<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Lapis - Resp:. Logia:. Sob:. Dignidad Humana N° 149</title>
  
  <!-- Tailwind CSS via CDN con Plugins -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  
  <!-- SweetAlert2 CSS y JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- Carga de Módulos JavaScript Previos -->
  <script src="js/api.js"></script>
  <script src="js/componentes.js"></script>

  <!-- Plugin Alpine.js Collapse (necesario para las transiciones de acordeón) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>

  <!-- Alpine.js Core y Aplicación Lapis -->
  <script src="js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans" x-data="appLapis">

  <!-- Navegación Superior -->
  <header class="bg-slate-900 text-white shadow-lg border-b border-amber-500/30 sticky top-0 z-40" x-data="{ menuMovilAbierto: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Logo Principal -->
        <div class="flex items-center gap-3 cursor-pointer" @click="vistaActual = 'pasos_perdidos'">
          <img src="logo.png" alt="Logo Logia Dignidad Humana N° 149" class="h-10 w-auto object-contain rounded">
          <div>
            <span class="font-extrabold text-amber-400 text-lg tracking-wide block leading-none">PROYECTO LAPIS</span>
            <span class="text-[10px] text-slate-400 uppercase tracking-widest block">R.:L.:S.: Dignidad Humana N° 149</span>
          </div>
        </div>

        <!-- Botones de Navegación de Escritorio -->
        <nav class="hidden md:flex items-center space-x-2">
          <button @click="vistaActual = 'pasos_perdidos'" 
                  :class="vistaActual === 'pasos_perdidos' ? 'bg-amber-500/20 text-amber-400 border-amber-500' : 'text-slate-300 hover:bg-slate-800 hover:text-white border-transparent'"
                  class="px-3 py-2 rounded-md text-sm font-medium transition-colors border-b-2">
            Pasos Perdidos
          </button>

          <button @click="vistaActual = 'tocar_puerta'" 
                  :class="vistaActual === 'tocar_puerta' ? 'bg-amber-500/20 text-amber-400 border-amber-500' : 'text-slate-300 hover:bg-slate-800 hover:text-white border-transparent'"
                  class="px-3 py-2 rounded-md text-sm font-medium transition-colors border-b-2">
            Tocar Puerta
          </button>

          <button @click="vistaActual = 'palabra_pase'" 
                  :class="vistaActual === 'palabra_pase' ? 'bg-amber-500/20 text-amber-400 border-amber-500' : 'text-slate-300 hover:bg-slate-800 hover:text-white border-transparent'"
                  class="px-3 py-2 rounded-md text-sm font-medium transition-colors border-b-2">
            Palabra de Pase
          </button>

          <button @click="vistaActual = 'umbral'" 
                  :class="vistaActual === 'umbral' ? 'bg-amber-500/20 text-amber-400 border-amber-500' : 'text-slate-300 hover:bg-slate-800 hover:text-white border-transparent'"
                  class="px-3 py-2 rounded-md text-sm font-medium transition-colors border-b-2">
            Umbral
          </button>

          <template x-if="tienePermisoPerfilTrono()">
            <button @click="vistaActual = 'admin'" 
                    :class="vistaActual === 'admin' ? 'bg-amber-500/20 text-amber-400 border-amber-500' : 'text-slate-300 hover:bg-slate-800 hover:text-white border-transparent'"
                    class="px-3 py-2 rounded-md text-sm font-medium transition-colors border-b-2 flex items-center gap-1.5">
              <span>👑</span>
              <span>Perfil del Trono</span>
            </button>
          </template>
        </nav>

        <!-- Bloque de Usuario y Menú Móvil Hamburger -->
        <div class="flex items-center gap-3">
          <template x-if="usuarioLogueado">
            <div class="flex items-center gap-3">
              <div class="text-right hidden sm:block">
                <span class="text-xs text-amber-400 font-bold block leading-none" x-text="usuarioLogueado.nombre"></span>
                <span class="text-[10px] text-slate-400 uppercase tracking-wider block" x-text="usuarioLogueado.rol.replace('_', ' ')"></span>
              </div>
              <button @click="cerrarSesion()" class="text-xs bg-red-900/50 hover:bg-red-800 text-red-200 px-3 py-1.5 rounded border border-red-500/30 transition-colors">
                Salir
              </button>
            </div>
          </template>

          <div class="md:hidden flex items-center">
            <button @click="menuMovilAbierto = !menuMovilAbierto" class="text-slate-300 hover:text-white p-2 focus:outline-none">
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path x-show="!menuMovilAbierto" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                <path x-show="menuMovilAbierto" x-cloak stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- Menú Desplegable Móvil -->
    <div x-show="menuMovilAbierto" x-cloak class="md:hidden bg-slate-800 border-b border-amber-500/20 px-4 pt-2 pb-4 space-y-2">
      <button @click="vistaActual = 'pasos_perdidos'; menuMovilAbierto = false" 
              class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-slate-300 hover:bg-slate-700 hover:text-white">
        Pasos Perdidos
      </button>

      <button @click="vistaActual = 'tocar_puerta'; menuMovilAbierto = false" 
              class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-slate-300 hover:bg-slate-700 hover:text-white">
        Tocar Puerta
      </button>

      <button @click="vistaActual = 'palabra_pase'; menuMovilAbierto = false" 
              class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-slate-300 hover:bg-slate-700 hover:text-white">
        Palabra de Pase
      </button>

      <button @click="vistaActual = 'umbral'; menuMovilAbierto = false" 
              class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-slate-300 hover:bg-slate-700 hover:text-white">
        Umbral
      </button>

      <template x-if="tienePermisoPerfilTrono()">
        <button @click="vistaActual = 'admin'; menuMovilAbierto = false" 
                class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-amber-400 hover:bg-slate-700">
          👑 Perfil del Trono
        </button>
      </template>
    </div>
  </header>

  <!-- Contenedor Dinámico Principal -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div x-html="window.VistasProyectoLapis[vistaActual]"></div>
  </main>

  <!-- Pie de Página Institucional -->
  <footer class="bg-slate-900 text-slate-400 border-t border-slate-800 py-6 text-center text-xs">
    <div class="max-w-7xl mx-auto px-4">
      <p class="mb-2">PROYECTO LAPIS — Resp:. Logia:. Sob:. Dignidad Humana N° 149</p>
      <p class="text-slate-500">© 2026 Todos los derechos reservados. Orientada a la fraternidad y perfeccionamiento moral.</p>
    </div>
  </footer>

</body>
</html>
